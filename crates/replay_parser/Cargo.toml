[package]
name = "replay_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boxcars = "0.11.5"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

# The wasm-pack action currently bundles a wasm-opt version that cannot parse
# the multiple Wasm tables emitted by the current Rust/wasm-bindgen toolchain.
# The Rust release build still runs; skip only this incompatible post-processing
# step until the action's Binaryen version catches up.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
